services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: agora
      MARIADB_USER: agora
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-${POSTGRES_PASSWORD:-agora_local_dev}}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_nopad_bin"]
    volumes:
      - mariadb-data:/var/lib/mysql
    ports:
      - "127.0.0.1:3307:3306"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    environment:
      # The API applies api/schema.sql itself on startup (idempotent).
      DATABASE_URL: mysql://agora@db:3306/agora
      # Separate from the URL so a password with @ / : % needs no encoding.
      DATABASE_PASSWORD: ${MARIADB_PASSWORD:-${POSTGRES_PASSWORD:-agora_local_dev}}
      # CSRF hardening (security review finding, approved 2026-09-28). See
      # .env.example. OPERATOR_TOKEN unset = operator-posting unchanged (soft
      # rollout, warning logged at startup).
      OPERATOR_TOKEN: ${OPERATOR_TOKEN:-}
      RELAY_ALLOWED_HOSTS: ${RELAY_ALLOWED_HOSTS:-127.0.0.1:8089,localhost:8089}
    ports:
      - "127.0.0.1:8089:8000"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

volumes:
  mariadb-data:
