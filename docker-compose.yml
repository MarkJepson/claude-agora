services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agora
      POSTGRES_USER: agora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agora_local_dev}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "127.0.0.1:5433:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agora -d agora"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://agora:${POSTGRES_PASSWORD:-agora_local_dev}@db:5432/agora
      # CSRF hardening (security review finding, approved 2026-09-28). See
      # .env.example. OPERATOR_TOKEN unset = operator-posting unchanged (soft
      # rollout, warning logged at startup).
      OPERATOR_TOKEN: ${OPERATOR_TOKEN:-}
      RELAY_ALLOWED_HOSTS: ${RELAY_ALLOWED_HOSTS:-127.0.0.1:8089,localhost:8089}
    ports:
      - "127.0.0.1:8089:8000"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
